name: Build and Publish Packages

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    outputs:
      version:      ${{ steps.version.outputs.version }}
      deb_version:  ${{ steps.version.outputs.deb_version }}
      arch_version: ${{ steps.version.outputs.arch_version }}
      channel:      ${{ steps.version.outputs.channel }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-tags: true

      - name: Determine version and channel
        id: version
        run: |
          BASE=$(git describe 2>/dev/null || echo "0.1.0")

          echo "git describe: $(git describe)"

          if [ "${GITHUB_REF_NAME}" = "master" ]; then
            echo "version=${BASE}"       >> $GITHUB_OUTPUT
            echo "deb_version=${BASE}"   >> $GITHUB_OUTPUT
            echo "arch_version=${BASE}"  >> $GITHUB_OUTPUT
            echo "channel=stable"        >> $GITHUB_OUTPUT
          else
            BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]-' | cut -c1-20)
            SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

            echo "version=${BASE}-dev.${BRANCH}.${SHA}"       >> $GITHUB_OUTPUT
            echo "deb_version=${BASE}~dev.${BRANCH}.${SHA}"   >> $GITHUB_OUTPUT
            echo "arch_version=${BASE}.dev.${BRANCH}.${SHA}"  >> $GITHUB_OUTPUT
            echo "channel=dev"                                >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies and build
        run: |
          cd src
          make deps
          make all

      - name: Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: app-binary
          path: src/build/app

  package-debian:
    needs: build
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-22.04

    steps:
      - name: Download binary
        uses: actions/download-artifact@v3
        with:
          name: app-binary
          path: dist/

      - name: Install fpm
        run: |
          apt-get update -qq
          apt-get install -y ruby ruby-dev rubygems build-essential
          gem install fpm --no-document

      - name: Build .deb package
        run: |
          chmod +x dist/app
          fpm \
            -s dir \
            -t deb \
            -n "sobkulacka" \
            -v "${{ needs.build.outputs.deb_version }}" \
            --description "Davidova Sobkulačka" \
            --maintainer "${{ github.repository_owner }}" \
            --url "${{ github.server_url }}/${{ github.repository }}" \
            --license "GPL-3.0-only" \
            dist/app=/usr/bin/sobkulacka

      - name: Publish to Forgejo Debian registry
        run: |
          CHANNEL="${{ needs.build.outputs.channel }}"
          DEB=$(ls sobkulacka_*.deb | head -1)
          curl --fail \
            -H "Authorization: token ${{ secrets.PACKAGES_TOKEN }}" \
            -X PUT \
            --upload-file "${DEB}" \
            "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/debian/pool/${CHANNEL}/main/upload"

  package-arch:
    needs: build
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04

    steps:
      - name: Download binary
        uses: actions/download-artifact@v3
        with:
          name: app-binary
          path: dist/

      - name: Set up Arch chroot
        run: |
          apt-get update -qq
          apt-get install -y curl zstd arch-install-scripts

          curl -L "https://mirror.vypal.me/arch/iso/latest/archlinux-bootstrap-x86_64.tar.zst" \
            -o /tmp/arch.tar.zst
          tar -xf /tmp/arch.tar.zst -C /tmp

          CHROOT=/tmp/root.x86_64

          echo 'Server = https://mirror.vypal.me/arch/$repo/os/$arch' \
            > $CHROOT/etc/pacman.d/mirrorlist
          mount --bind $CHROOT $CHROOT
          arch-chroot $CHROOT pacman-key --init
          arch-chroot $CHROOT pacman-key --populate archlinux
          arch-chroot $CHROOT pacman -Sy --noconfirm base-devel

          arch-chroot $CHROOT useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> $CHROOT/etc/sudoers

      - name: Build Arch package
        run: |
          CHROOT=/tmp/root.x86_64

          mkdir -p $CHROOT/build
          cp dist/app $CHROOT/build/app
          chmod +x $CHROOT/build/app

          cat > $CHROOT/build/PKGBUILD << 'EOF'
          pkgname=sobkulacka
          pkgver=PKGVER_PLACEHOLDER
          pkgrel=1
          pkgdesc="Davidova Sobkulačka"
          arch=('x86_64')
          url="REPO_URL_PLACEHOLDER"
          license=('GPL3.0-only')

          package() {
            install -Dm755 "${startdir}/app" "${pkgdir}/usr/bin/sobkulacka"
          }
          EOF

          sed -i "s|PKGVER_PLACEHOLDER|${{ needs.build.outputs.arch_version }}|g" $CHROOT/build/PKGBUILD
          sed -i "s|REPO_URL_PLACEHOLDER|${{ github.server_url }}/${{ github.repository }}|g" $CHROOT/build/PKGBUILD

          chown -R 1000:1000 $CHROOT/build
          arch-chroot $CHROOT su builder -c "cd /build && makepkg -f --nodeps"

      - name: Publish to Forgejo Arch registry
        run: |
          PKG=$(ls /tmp/root.x86_64/build/*.pkg.tar.zst | head -1)
          curl --fail \
            -H "Authorization: token ${{ secrets.PACKAGES_TOKEN }}" \
            -X PUT \
            --upload-file "${PKG}" \
            "${{ github.server_url }}/api/packages/${{ github.repository_owner }}/arch/push"
