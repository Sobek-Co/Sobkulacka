name: Run Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('src/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install basic build tools
        run: |
          apt-get update
          apt-get install -y make gcc pkg-config

      - name: Prepare for tests
        run: |
          cd src
          make deps
      - name: Run tests
        run: |
          cd src
          make test
